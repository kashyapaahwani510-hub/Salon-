<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><title>Salon Booking</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#1f1b16;--mu:#6f675c;--ac:#b4543a;--ac2:#f3e2db;--bd:#e6dfd3}
@media(prefers-color-scheme:dark){:root{--bg:#17140f;--card:#221e18;--tx:#f3eee6;--mu:#a49a8b;--ac:#e08a6f;--ac2:#3a2a24;--bd:#3a342b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,sans-serif;padding-top:env(safe-area-inset-top,0)}
main{max-width:560px;margin:0 auto;padding:16px}h1{font-size:22px;margin:4px 0}
.tabs{display:flex;gap:8px;margin:10px 0}.tabs button{flex:1}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 12px;border-radius:10px;cursor:pointer}
button.on,button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}button:disabled{opacity:.4}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
h2{font-size:14px;margin:0 0 10px;color:var(--mu);text-transform:uppercase}
.svc{display:flex;justify-content:space-between;width:100%;margin-bottom:8px}.svc.on{background:var(--ac2);border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.days{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}.days button{min-width:70px}
input,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-bottom:8px}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.m{color:var(--mu);font-size:14px}.ok{color:#2e7d4f}.er{color:#c0392b}.hide{display:none}
</style></head><body><main>
<div class="row"><h1 id="ttl">✂️ Salon Booking</h1><button id="auth">Login</button></div>
<p id="acc" class="m"></p>
<div class="tabs"><button id="tC" class="on">Book karo</button><button id="tM">Meri bookings</button><button id="tA" class="hide">Admin</button></div>
<section id="vC">
 <div class="card"><h2>1. Service</h2><div id="svcs"></div></div>
 <div class="card"><h2>2. Din aur time</h2><div class="days" id="days"></div><div class="grid" id="slots" style="margin-top:10px"></div></div>
 <div class="card"><h2>3. Details</h2><input id="nm" placeholder="Naam"><input id="ph" placeholder="Mobile number" inputmode="tel"><button id="go" class="pri" style="width:100%">Booking confirm karo</button><p id="msg" class="m"></p></div>
</section>
<section id="vM" class="hide"><div class="card"><h2>Meri bookings</h2><div id="mine"></div></div></section>
<section id="vA" class="hide">
 <div class="card"><h2>Salon settings</h2><input id="sn" placeholder="Salon ka naam"><input id="wa" placeholder="WhatsApp (91XXXXXXXXXX)" inputmode="tel">
  <textarea id="sv" rows="6" placeholder="Har line me: Service,Rate"></textarea>
  <div class="row"><span class="m">Khulne / band hone ka ghanta</span><span><input id="h0" type="number" style="width:64px;display:inline;margin:0"> <input id="h1" type="number" style="width:64px;display:inline;margin:0"></span></div>
  <button id="save" class="pri" style="width:100%;margin-top:8px">Save karo</button><p id="em" class="m"></p></div>
 <div class="card"><h2>Aane wali bookings</h2><div id="list" class="m"></div></div>
</section>
</main><script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,collection,query,where,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const firebaseConfig = {
  apiKey: "AIzaSyCC3MepFnCWTWC5uVAC7qeVKTH4Fr0IptE",
  authDomain: "salon-booking-a1fdf.firebaseapp.com",
  projectId: "salon-booking-a1fdf",
  appId: "1:293548495395:web:f6270ab34c114b6a199796"
};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const ymd=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()+i);return d});
let user=null,admin=false,unsubs=[];
let cfg={name:"Salon Booking",wa:"",start:10,end:20,services:[["Haircut",150],["Shave / Beard",80],["Haircut + Beard",200],["Hair Colour",500],["Facial",400]]};
const st={svc:null,day:null,time:null,taken:{},mine:[],all:[]};
const times=()=>{const t=[];for(let h=cfg.start;h<=cfg.end;h++)t.push(String(h).padStart(2,"0")+":00");return t};
const today=()=>ymd(new Date());
const sortB=a=>a.sort((x,y)=>(x.day+x.time).localeCompare(y.day+y.time));

function render(){
 $("ttl").textContent="✂️ "+cfg.name;document.title=cfg.name;
 $("svcs").innerHTML="";cfg.services.forEach((s,i)=>{const b=document.createElement("button");b.className="svc"+(st.svc===i?" on":"");b.innerHTML="<span></span><b></b>";b.firstChild.textContent=s[0];b.lastChild.textContent="₹"+s[1];b.onclick=()=>{st.svc=i;render()};$("svcs").appendChild(b)});
 $("days").innerHTML="";days.forEach(d=>{const k=ymd(d),b=document.createElement("button");b.className=st.day===k?"on":"";b.innerHTML=d.toLocaleDateString("en-IN",{weekday:"short"})+"<br>"+d.getDate()+" "+d.toLocaleDateString("en-IN",{month:"short"});b.onclick=()=>{st.day=k;st.time=null;render()};$("days").appendChild(b)});
 $("slots").innerHTML=st.day?"":'<span class="m">Pehle din chuno</span>';
 if(st.day){const h=new Date().getHours();times().forEach(t=>{const b=document.createElement("button");b.textContent=t;b.disabled=!!st.taken[st.day+"_"+t]||(st.day===today()&&parseInt(t)<=h);b.className=st.time===t?"on":"";b.onclick=()=>{st.time=t;render()};$("slots").appendChild(b)})}
 $("go").disabled=!(st.svc!==null&&st.day&&st.time);
 $("auth").textContent=user?"Logout":"Login";
 $("acc").textContent=user?"✅ "+(user.displayName||user.email)+(admin?" • Admin":""):"Booking ke liye pehle Login karo";
 $("tA").classList.toggle("hide",!admin);
 list($("mine"),st.mine.filter(x=>x.day>=today()),"Abhi koi booking nahi.",false);
 if(admin)list($("list"),st.all.filter(x=>x.day>=today()),"Abhi koi booking nahi.",true);
}
function list(el,rows,empty,isAdmin){
 el.innerHTML="";if(!rows.length){el.textContent=empty;return}
 rows.forEach(r=>{const d=document.createElement("div");d.className="card";
  d.innerHTML='<div class="row"><b></b><span class="m"></span></div><div class="m"></div>';
  d.querySelector("b").textContent=r.day+" • "+r.time;d.querySelector("span").textContent="₹"+r.price;
  const info=d.lastChild;info.textContent=(isAdmin?r.name+" • ":"")+r.service;
  if(isAdmin){const a=document.createElement("a");a.href="tel:"+String(r.phone).replace(/[^\d+]/g,"");a.textContent=" • "+r.phone;a.style.color="var(--ac)";info.appendChild(a)}
  const b=document.createElement("button");b.textContent="Cancel karo";b.style.marginTop="8px";let armed=false;
  b.onclick=async()=>{if(!armed){armed=true;b.textContent="Pakka cancel?";b.className="pri";setTimeout(()=>{armed=false;b.textContent="Cancel karo";b.className=""},4000);return}
   try{const w=writeBatch(db);w.delete(doc(db,"bookings",r.id));w.delete(doc(db,"slots",r.id));await w.commit()}catch(e){alert("Cancel nahi hua")}};
  d.appendChild(b);el.appendChild(d)})}

async function book(){
 const m=$("msg"),nm=$("nm").value.trim(),ph=$("ph").value.trim();
 if(!user){m.className="m er";m.textContent="Pehle Login karo.";return}
 if(!nm||ph.replace(/\D/g,"").length<10){m.className="m er";m.textContent="Naam aur 10 digit mobile daalo.";return}
 const id=st.day+"_"+st.time,s=cfg.services[st.svc];$("go").disabled=true;
 try{const w=writeBatch(db);
  w.set(doc(db,"slots",id),{uid:user.uid});
  w.set(doc(db,"bookings",id),{uid:user.uid,name:nm,phone:ph,service:s[0],price:s[1],day:st.day,time:st.time,created:Date.now()});
  await w.commit();
  m.className="m ok";m.textContent="✅ Booking pakki! "+st.day+" ko "+st.time+" baje aana.";
  if(cfg.wa){const a=document.createElement("a");a.href="https://wa.me/"+cfg.wa+"?text="+encodeURIComponent("Namaste, maine "+st.day+" ko "+st.time+" baje "+s[0]+" ke liye booking ki hai. Naam: "+nm);a.target="_blank";a.textContent=" WhatsApp par bhejo";a.style.color="var(--ac)";m.appendChild(a)}
  st.time=null;
 }catch(e){m.className="m er";m.textContent="Ye slot abhi kisi ne le liya ya booking nahi hui. Dusra slot chuno."}
 render();
}
async function saveCfg(){
 const sv=$("sv").value.split("\n").map(l=>l.split(",")).filter(p=>p[0].trim()).map(p=>[p[0].trim(),+p[1]||0]);
 const a=+$("h0").value,b=+$("h1").value,m=$("em");
 if(!sv.length||!(a>=0&&b>a&&b<=23)){m.className="m er";m.textContent="Service aur sahi time daalo.";return}
 try{await setDoc(doc(db,"config","main"),{name:$("sn").value.trim()||cfg.name,wa:$("wa").value.replace(/\D/g,""),services:sv,start:a,end:b});m.className="m ok";m.textContent="✅ Save ho gaya"}
 catch(e){m.className="m er";m.textContent="Save nahi hua."}
}
function fillAdmin(){$("sn").value=cfg.name;$("wa").value=cfg.wa;$("sv").value=cfg.services.map(s=>s.join(",")).join("\n");$("h0").value=cfg.start;$("h1").value=cfg.end}

function tab(n){[["tC","vC"],["tM","vM"],["tA","vA"]].forEach(([b,v])=>{$(v).classList.toggle("hide",b!==n);$(b).classList.toggle("on",b===n)})}
["tC","tM","tA"].forEach(t=>$(t).onclick=()=>tab(t));
$("go").onclick=book;$("save").onclick=saveCfg;
$("auth").onclick=()=>user?signOut(auth):signInWithPopup(auth,new GoogleAuthProvider()).catch(()=>{});

onSnapshot(doc(db,"config","main"),s=>{if(s.exists()){cfg={...cfg,...s.data()};st.svc=null;st.time=null}fillAdmin();render()});
onSnapshot(collection(db,"slots"),s=>{st.taken={};s.docs.forEach(d=>st.taken[d.id]=1);render()});
onAuthStateChanged(auth,async u=>{
 unsubs.forEach(f=>f());unsubs=[];user=u;admin=false;st.mine=[];st.all=[];
 if(u){
  try{admin=(await getDoc(doc(db,"admins",u.uid))).exists()}catch(e){}
  unsubs.push(onSnapshot(query(collection(db,"bookings"),where("uid","==",u.uid)),s=>{st.mine=sortB(s.docs.map(d=>({id:d.id,...d.data()})));render()}));
  if(admin)unsubs.push(onSnapshot(collection(db,"bookings"),s=>{st.all=sortB(s.docs.map(d=>({id:d.id,...d.data()})));render()}));
 }else tab("tC");
 render();
});
render();

</script></body></html>
